<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Проєкт — Rodionactive</title>
<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Onest:wght@400;500;600&family=Unbounded:wght@500;600;700&display=swap">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="portfolio">
<header data-site-header></header>

<main class="wrap">
  <article data-article>
    <div class="article-head">
      <a class="back" href="portfolio.html"><span>←</span> Усі проєкти</a>
      <div class="skeleton" style="height:3.2em;max-width:620px"></div>
    </div>
  </article>
</main>

<footer data-site-footer></footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<script src="assets/js/main.js"></script>
<script>
  const box = document.querySelector("[data-article]");
  async function show() {
    const slug = decodeURIComponent(location.hash.slice(1));
    const list = await loadJSON("projects").catch(() => []);
    const p = list.find(x => x.slug === slug);
    if (!p) {
      box.innerHTML = `<div class="article-head"><a class="back" href="portfolio.html"><span>←</span> Усі проєкти</a><h1>Проєкт не знайдено</h1><p class="muted">Подивіться інші роботи в портфоліо.</p></div>`;
      return;
    }
    document.title = `${p.title} — ${SITE.name}`;
    box.innerHTML = `
      <div class="article-head">
        <a class="back rise" href="portfolio.html"><span>←</span> Усі проєкти</a>
        <div class="info rise" style="--d:1"><span class="chip lang">${esc(p.category)}</span><span>${esc(p.year || "")}</span>${(p.tags || []).map(t => `<span class="chip">${esc(t)}</span>`).join("")}</div>
        <h1 class="rise" style="--d:2">${esc(p.title)}</h1>
        <p class="lead rise" style="--d:3;max-width:52ch">${esc(p.summary)}</p>
        ${p.url ? `<div class="rise" style="--d:4"><a class="btn" href="${esc(p.url)}" target="_blank" rel="noopener">Відкрити сайт <span class="arr">↗</span></a></div>` : ""}
      </div>
      ${p.cover ? `<div class="article-cover rise" style="--d:4"><img src="${esc(img(p.cover))}" alt="${esc(p.title)}"></div>` : ""}
      <div class="prose">${renderMarkdown(p.body)}</div>`;
    scrollTo(0, 0);
  }
  addEventListener("hashchange", show);
  show();
</script>
</body>
</html>
